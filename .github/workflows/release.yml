name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          bash -n scripts/install.sh
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          asset="rook-${GOOS}-${GOARCH}"
          # Retain symbol tables so govulncheck can identify code actually
          # present in the binary instead of falling back to module-level checks.
          go build -trimpath -ldflags="-w -X main.version=${GITHUB_REF_NAME}" -o "dist/${asset}" ./cmd/rook
          env -u GOOS -u GOARCH go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "dist/${asset}"
          (cd dist && sha256sum "${asset}" > "${asset}.sha256")
      - name: Attest release binary
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/rook-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Include verification bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/rook-${{ matrix.goos }}-${{ matrix.goarch }}.sigstore.json"
      - uses: actions/upload-artifact@v6
        with:
          name: rook-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: rook-linux-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
